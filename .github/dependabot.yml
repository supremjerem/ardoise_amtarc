version: 2

updates:
  # Dependency updates are day-to-day work, so they land on develop and reach
  # main through the same reviewed pull request as everything else. Aimed at
  # main they would sit apart from the branch they have to be tested against.
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Nobody will be watching this repository daily. Grouping keeps the noise
    # down to one reviewable PR a month instead of a dozen.
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
