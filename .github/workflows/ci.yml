name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    # The balance rules are the part of this app that must not break, so the
    # test job runs against a real Postgres rather than a mocked one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ardoise
          POSTGRES_PASSWORD: ardoise
          POSTGRES_DB: ardoise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ardoise -d ardoise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ardoise:ardoise@localhost:5432/ardoise_test
      # CI-only values. Real secrets live in the hosting environment.
      IP_HASH_SECRET: ci-only-ip-hash-secret-value-32-bytes
      PIN_PEPPER: ci-only-pin-pepper-value-at-least-32b

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Keep this on an Active LTS, and keep @types/node on the same major:
          # types describing a runtime the app never runs on are worse than no
          # types at all.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # The browser binary is ~100 MB, so it is cached. Keyed on the lockfile:
      # the browser version is pinned by the Playwright version, and the
      # lockfile is what changes when that does.
      - name: Cache the browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # System libraries are outside the cached directory.
      - name: Install browser system dependencies
        run: pnpm exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      # The end-to-end suite signs in with the demo accounts and asserts on
      # exact balances, so it needs the seed in place before it starts.
      - name: Seed the test database
        run: pnpm db:seed

      - name: End-to-end tests
        run: pnpm test:e2e

      # Only useful when something failed; the trace is how you find out why.
      - name: Upload the Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
